services:
  openai-router:
    image: openai-router:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openai-router
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    ports:
      - "8082:8082"
    restart: unless-stopped
    command: openai-router --host 0.0.0.0 --port 8082
  
