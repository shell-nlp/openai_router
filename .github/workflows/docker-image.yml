name: Docker Image CI

on:
  push:
    tags:
    - 'v*.*.*' # 仅当推送形如 v0.1.0 的标签时触发，触发后自动链式执行 build_version → tag_latest

jobs:
  build_version:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Extract version
      id: get_version
      run: |
        version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
        echo "VERSION=$version" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build -f Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/openai-router:${{ env.VERSION }} .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/openai-router:${{ env.VERSION }}

  tag_latest:
    needs: build_version
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Extract version
      id: get_version
      run: |
        version=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
        echo "VERSION=$version" >> $GITHUB_ENV

    - name: Install skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Retag remote image without pulling
      run: |
        skopeo copy \
          docker://${{ secrets.DOCKER_USERNAME }}/openai-router:${{ env.VERSION }} \
          docker://${{ secrets.DOCKER_USERNAME }}/openai-router:latest
